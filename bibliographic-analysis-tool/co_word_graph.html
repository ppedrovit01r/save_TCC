                  nodes = new vis.DataSet([{"color": "#97c2fc", "font": {"color": "#222222"}, "id": "journal", "label": "journal", "shape": "dot", "size": 30, "title": "journal"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "aprimorar", "label": "aprimorar", "shape": "dot", "size": 11, "title": "aprimorar (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "satisfa\u00e7\u00e3o", "label": "satisfa\u00e7\u00e3o", "shape": "dot", "size": 11, "title": "satisfa\u00e7\u00e3o (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "amplitude", "label": "amplitude", "shape": "dot", "size": 11, "title": "amplitude (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "ser", "label": "ser", "shape": "dot", "size": 11, "title": "ser (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "avalia\u00e7\u00f5es", "label": "avalia\u00e7\u00f5es", "shape": "dot", "size": 11, "title": "avalia\u00e7\u00f5es (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "pelo", "label": "pelo", "shape": "dot", "size": 11, "title": "pelo (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "publica\u00e7\u00e3o", "label": "publica\u00e7\u00e3o", "shape": "dot", "size": 11, "title": "publica\u00e7\u00e3o (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "ambientes", "label": "ambientes", "shape": "dot", "size": 11, "title": "ambientes (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "universidade", "label": "universidade", "shape": "dot", "size": 11, "title": "universidade (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "\u00e1rea", "label": "\u00e1rea", "shape": "dot", "size": 11, "title": "\u00e1rea (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "maturidade", "label": "maturidade", "shape": "dot", "size": 11, "title": "maturidade (1\u00d7)"}, {"color": "#97c2fc", "font": {"color": "#222222"}, "id": "m                   var options = {
    "configure": {

};
